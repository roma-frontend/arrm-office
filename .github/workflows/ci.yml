# Strata Platform — CI/CD Pipeline
# Recommended branch protection: require PR, 1+ approvals, required status checks

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.18.0'
  CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT }}
  NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL }}

jobs:
  lint:
    name: '🔍 Lint (strict)'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: ESLint (max-warnings=0 where possible; enforced on changed files)
        run: npm run lint
      - name: Prettier check
        run: npx prettier --check "**/*.{ts,tsx,js,jsx,json,css,md}"
      - name: Locale parity (EN is the reference)
        run: npm run check:locales

  type-check:
    name: '🔠 Type Check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - run: npx tsc --noEmit

  unit-tests:
    name: '🧪 Unit Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - name: Run tests with coverage
        run: npm run test:coverage -- --ci --reporters=default --reporters=jest-junit
        env:
          JEST_JUNIT_OUTPUT_DIR: ./reports/junit
      - name: Extract coverage summary
        id: coverage
        run: |
          node -e "
            const j = require('./coverage/coverage-summary.json');
            const t = j.total.lines;
            const s = 
              '### ☂️ Coverage Report\n' +
              '| Metric | Coverage |\n' +
              '|--------|---------|\n' +
              '| **Lines** | ' + t.pct.toFixed(2) + '% (' + t.covered + '/' + t.total + ') |\n' +
              '| **Functions** | ' + j.total.functions.pct.toFixed(2) + '% |\n' +
              '| **Branches** | ' + j.total.branches.pct.toFixed(2) + '% |\n' +
              '| **Statements** | ' + j.total.statements.pct.toFixed(2) + '% |\n';
            require('fs').writeFileSync('coverage-summary.md', s);
            // Also write a JSON-safe version for the step output
            console.log(s);
          "
      - name: Upload LCOV report to Codecov
        uses: codecov/codecov-action@v5
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          fail_ci_if_error: false
          verbose: false
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage/
            coverage-summary.md
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: reports/junit/
          retention-days: 30

  coverage-report:
    name: '📊 Coverage Report'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests]
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download base branch coverage from main
        uses: dawidd6/action-download-artifact@v3
        continue-on-error: true
        with:
          branch: main
          name: coverage-report
          path: base-coverage
          if_no_artifact_found: warn
      - name: Download head coverage summary
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Compare coverage with base branch
        id: diff
        run: |
          if [ -f base-coverage/coverage/coverage-summary.json ]; then
            node scripts/compare-coverage.mjs \
              base-coverage/coverage/coverage-summary.json \
              coverage/coverage-summary.json
            echo "diff_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "No base coverage found — first run or base artifact missing."
            echo "diff_available=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Combine coverage summary and diff
        run: |
          echo "$(cat coverage-summary.md)" > combined.md
          echo "" >> combined.md
          if [ -f coverage-diff.md ]; then
            cat coverage-diff.md >> combined.md
          else
            echo "_Coverage diff: no base data available yet._" >> combined.md
          fi
      - name: Find or create coverage comment
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: github-actions[bot]
          body-includes: '### ☂️ Coverage Report'
      - name: Post or update coverage comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          body-path: combined.md
          edit-mode: replace

  coverage-badge:
    name: '🏷️ Coverage Badge'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download coverage report from unit-tests
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
      - name: Check if coverage thresholds can be ratcheted up
        id: ratchet
        run: |
          echo "Checking if coverage thresholds can be raised..."
          if node scripts/ratchet-coverage.mjs; then
            echo "ratchet_needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "ratchet_needed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply coverage ratchet
        if: steps.ratchet.outputs.ratchet_needed == 'true'
        run: node scripts/ratchet-coverage.mjs --apply
      - name: Create PR with threshold bump
        if: steps.ratchet.outputs.ratchet_needed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          add-paths: jest.config.js
          commit-message: 'chore: ratchet coverage thresholds'
          title: '⚡ Auto-ratchet coverage thresholds'
          body: |
            Coverage has improved beyond the current thresholds.
            This PR bumps them to the next level to prevent regression.

            See `scripts/ratchet-coverage.mjs` for the ratchet formula
            (threshold = floor(current_coverage - 1pp buffer)).
          branch: chore/ratchet-coverage
          labels: automated-pr, coverage
          delete-branch: true
      - name: Generate badge JSON
        run: node scripts/generate-coverage-badge.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: badges/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ═════════════════════════════════════════════════════════════
  # SECURITY — supply-chain + static analysis
  # ═════════════════════════════════════════════════════════════
  security-audit:
    name: '🔒 Security Audit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # dependency-review-action queries the repo's Dependency Graph, which needs
    # read access to contents + PR metadata.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: npm audit (high+ report; non-blocking — known transitive advisories tracked separately)
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: Dependency Review (PRs only)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        # Non-blocking: the job must not fail if the Dependency Graph API is
        # unavailable (e.g. graph still propagating, or disabled). Real high+
        # advisories are already reported by the npm audit step above.
        continue-on-error: true
        with:
          fail-on-severity: high
          comment-summary-in-pr: always

  codeql:
    name: '🔒 CodeQL Static Analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: +security-and-quality
      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'

  build:
    name: '🏗 Build'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, type-check, unit-tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - run: npm run build
        env:
          NEXTAUTH_SECRET: build-placeholder-NEXTAUTH_SECRET-value-32chars-min
          AUTH_SECRET: build-placeholder-AUTH_SECRET-value-32chars-min-x
          JWT_SECRET: build-placeholder-JWT_SECRET-value-must-be-at-least-32-chars-long
          CSRF_SECRET: build-placeholder-CSRF_SECRET-value-32chars-min
          NEXTAUTH_URL: https://hr-project-sigma.vercel.app
          AUTH_URL: https://hr-project-sigma.vercel.app
          # Fall back to placeholders so the production build's env validation
          # passes even when these repo secrets are unset (real values win if set).
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT || 'dev:build-placeholder' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://build-placeholder.convex.cloud' }}
          AUTH_GOOGLE_ID: build-placeholder
          AUTH_GOOGLE_SECRET: build-placeholder
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx') }}
      - uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: .next/
          retention-days: 7

  e2e-tests:
    name: '🎭 E2E Tests'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci --prefer-offline --no-audit
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit
      # Playwright serves the suite with `next start` on CI (see
      # playwright.config.ts), which needs a real build. Built here rather than
      # reusing the `build` job's artifact so the build- and run-time env match
      # exactly — that job builds with the production NEXTAUTH_URL.
      - name: Build for E2E
        run: npm run build
        env:
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          AUTH_SECRET: test-secret-for-ci-only-not-for-production
          JWT_SECRET: test-secret-for-ci-only-not-for-production-32chars-xxx
          CSRF_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT || 'dev:build-placeholder' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://build-placeholder.convex.cloud' }}
          AUTH_GOOGLE_ID: build-placeholder
          AUTH_GOOGLE_SECRET: build-placeholder
      - run: npm run test:e2e
        env:
          NEXTAUTH_SECRET: test-secret-for-ci-only-not-for-production
          AUTH_SECRET: test-secret-for-ci-only-not-for-production
          JWT_SECRET: test-secret-for-ci-only-not-for-production-32chars-xxx
          CSRF_SECRET: test-secret-for-ci-only-not-for-production
          NEXTAUTH_URL: http://localhost:3000
          AUTH_URL: http://localhost:3000
          # The Next web server (started by Playwright) runs env validation in
          # layout.tsx; provide placeholders so it boots when secrets are unset.
          CONVEX_DEPLOYMENT: ${{ secrets.CONVEX_DEPLOYMENT || 'dev:build-placeholder' }}
          NEXT_PUBLIC_CONVEX_URL: ${{ secrets.NEXT_PUBLIC_CONVEX_URL || 'https://build-placeholder.convex.cloud' }}
          AUTH_GOOGLE_ID: build-placeholder
          AUTH_GOOGLE_SECRET: build-placeholder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 14

  # GitHub does not allow secrets.* in a job-level `if:`, so surface the
  # presence of VERCEL_TOKEN as an output the deploy jobs can gate on. This
  # lets CI pass on forks / before secrets are configured, while the deploy
  # runs automatically once the token is added in repo settings.
  check-deploy-secret:
    name: '🔑 Deploy Secret Check'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        run: echo "enabled=${{ secrets.VERCEL_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

  deploy-preview:
    name: '🔍 Deploy Preview'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, check-deploy-secret]
    if: github.event_name == 'pull_request' && needs.check-deploy-secret.outputs.enabled == 'true'
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.preview-url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "preview-url=$URL" >> $GITHUB_OUTPUT

  deploy-production:
    name: '🚀 Deploy Production'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, e2e-tests, codeql, security-audit, check-deploy-secret]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.check-deploy-secret.outputs.enabled == 'true'
    environment:
      name: production
      url: https://hr-project-sigma.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm install -g vercel
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
      - id: deploy
        run: |
          URL=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "production-url=$URL" >> $GITHUB_OUTPUT
      - run: npm ci --prefer-offline --no-audit
      - run: npx convex deploy --prod
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        with:
          environment: production
          sourcemaps: .next/static/chunks
        continue-on-error: true

# Required GitHub Secrets:
# VERCEL_TOKEN, CONVEX_DEPLOYMENT, NEXT_PUBLIC_CONVEX_URL,
# CONVEX_DEPLOY_KEY, SENTRY_AUTH_TOKEN, SENTRY_ORG, SENTRY_PROJECT,
# CODECOV_TOKEN (Repository Upload Token from codecov.io)
